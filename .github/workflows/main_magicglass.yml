name: Build and deploy Python app to Azure Web App - MagicGlass
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Create clean deployment package
        run: |
          # Create a deployment directory
          mkdir deploy_package
          
          # Copy only necessary files
          cp -r . deploy_package/
          
          # Remove unnecessary files
          cd deploy_package
          rm -rf .git* *.pyc __pycache__ .pytest_cache .vscode .github
          
          # Create a startup script if doesn't exist
          if [ ! -f "startup.sh" ]; then
            echo "python app.py" > startup.sh
            chmod +x startup.sh
          fi
          
          cd ..
          
          # Zip from within the directory to avoid nested structure
          cd deploy_package
          zip -r ../release.zip .
          cd ..
          
          # Verify zip contents
          echo "Contents of release.zip:"
          unzip -l release.zip | head -20
          
          # Verify critical files exist
          echo "Checking for critical files..."
          unzip -l release.zip | grep -E "requirements.txt|app.py|application.py|wsgi.py|startup.sh"
 
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip
          retention-days: 1
 
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
 
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
 
      - name: Verify downloaded package
        run: |
          echo "Verifying downloaded release.zip:"
          unzip -l release.zip | head -20
          ls -lh release.zip
 
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8BE82E4C63B94566B744FAA35ED89A4B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5626732180BB449D9FDACB6B49B711B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B61000D65E6F4F7BB476597A6375BE49 }}
 
      - name: Configure App Settings Before Deployment
        run: |
          # Ensure build automation is enabled
          az webapp config appsettings set \
            --name MagicGlass \
            --resource-group assist-vision \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              WEBSITE_RUN_FROM_PACKAGE=0 \
              ENABLE_ORYX_BUILD=true
          
          # Set Python version explicitly
          az webapp config set \
            --name MagicGlass \
            --resource-group assist-vision \
            --linux-fx-version "PYTHON:3.11"
 
      - name: Stop app before deployment
        run: |
          az webapp stop --name MagicGlass --resource-group assist-vision
          sleep 30
 
      - name: Deploy using ZipDeploy with verbose output
        run: |
          # Try deployment with detailed logging
          az webapp deploy \
            --name MagicGlass \
            --resource-group assist-vision \
            --src-path release.zip \
            --type zip \
            --async false \
            --verbose
          
      - name: Start the app
        run: |
          az webapp start --name MagicGlass --resource-group assist-vision
          sleep 30
          
          # Verify deployment
          APP_URL="https://magicglass-gegme7abcff0d5az.japaneast-01.azurewebsites.net"
          echo "Checking application at $APP_URL"
          
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $APP_URL --max-time 30 || echo "000")
            echo "Attempt $i/10 - HTTP Status: $HTTP_CODE"
            
            if [[ "$HTTP_CODE" == "200" ]] || [[ "$HTTP_CODE" == "302" ]]; then
              echo "✅ Application deployed successfully!"
              exit 0
            fi
            sleep 10
          done
          
          echo "⚠️ Application may still be starting up"
          echo "Check logs at: https://magicglass-gegme7abcff0d5az.scm.japaneast-01.azurewebsites.net/api/logdump"
