name: Build and deploy Python app to Azure Web App - MagicGlass
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Zip only app files (no packages, no git)
        run: |
          zip -r release.zip . \
            --exclude "*.git*" \
            --exclude ".python_packages/*" \
            --exclude "antenv/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "output.tar*" \
            --exclude "*.ipynb"
 
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip
          retention-days: 1
 
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
 
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
 
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8BE82E4C63B94566B744FAA35ED89A4B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5626732180BB449D9FDACB6B49B711B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B61000D65E6F4F7BB476597A6375BE49 }}
 
      - name: Stop Azure Web App before deploy
        run: az webapp stop --name MagicGlass --resource-group assist-vision
 
      - name: Wait for app to stop
        run: sleep 15
 
      - name: Deploy zip to Azure Web App
        run: |
          az webapp deploy \
            --name MagicGlass \
            --resource-group assist-vision \
            --src-path release.zip \
            --type zip \
            --async false
 
      - name: Start Azure Web App after deploy
        run: az webapp start --name MagicGlass --resource-group assist-vision
