  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8BE82E4C63B94566B744FAA35ED89A4B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5626732180BB449D9FDACB6B49B711B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B61000D65E6F4F7BB476597A6375BE49 }}

      - name: Force recover the App Service
        run: |
          echo "🔄 Attempting forced recovery..."
          
          # Force stop the app
          az webapp stop --name MagicGlass --resource-group assist-vision || true
          sleep 30
          
          # Restart the underlying container
          az webapp restart --name MagicGlass --resource-group assist-vision
          sleep 45
          
          # Test if Kudu is responding
          KUDU_URL="https://magicglass-gegme7abcff0d5az.scm.japaneast-01.azurewebsites.net"
          echo "Testing Kudu accessibility..."
          
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $KUDU_URL --max-time 10 || echo "000")
            echo "Attempt $i/12 - Kudu HTTP Status: $HTTP_CODE"
            
            if [[ "$HTTP_CODE" == "200" ]] || [[ "$HTTP_CODE" == "401" ]] || [[ "$HTTP_CODE" == "302" ]]; then
              echo "✅ Kudu is accessible!"
              break
            fi
            
            if [[ "$HTTP_CODE" == "502" ]] && [ $i -eq 12 ]; then
              echo "❌ Kudu still failing after 2 minutes - need recreation"
              echo "RECREATE_NEEDED=true" >> $GITHUB_ENV
            fi
            sleep 10
          done

      - name: Recreate App Service if unrecoverable
        if: env.RECREATE_NEEDED == 'true'
        run: |
          echo "⚠️ Recreating App Service instance..."
          
          # Get the App Service Plan name
          APP_PLAN=$(az webapp show \
            --name MagicGlass \
            --resource-group assist-vision \
            --query "appServicePlanId" \
            -o tsv | cut -d'/' -f9)
          
          echo "App Service Plan: $APP_PLAN"
          
          # Delete and recreate the web app (preserves settings)
          az webapp delete \
            --name MagicGlass \
            --resource-group assist-vision \
            --keep-empty-plan
          
          sleep 30
          
          # Recreate with same configuration
          az webapp create \
            --name MagicGlass \
            --resource-group assist-vision \
            --plan $APP_PLAN \
            --runtime "PYTHON:3.11"
          
          echo "✅ App Service recreated"
          sleep 30

      - name: Configure App Settings
        run: |
          # Set critical settings for deployment
          az webapp config appsettings set \
            --name MagicGlass \
            --resource-group assist-vision \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              WEBSITE_RUN_FROM_PACKAGE=0 \
              ENABLE_ORYX_BUILD=true
          
          # Set Linux runtime
          az webapp config set \
            --name MagicGlass \
            --resource-group assist-vision \
            --linux-fx-version "PYTHON:3.11"

      - name: Stop app before deployment
        run: |
          az webapp stop --name MagicGlass --resource-group assist-vision
          sleep 30

      - name: Deploy using ZipDeploy
        run: |
          az webapp deploy \
            --name MagicGlass \
            --resource-group assist-vision \
            --src-path release.zip \
            --type zip \
            --async false

      - name: Start the app
        run: |
          az webapp start --name MagicGlass --resource-group assist-vision
          sleep 20
          
          # Verify app is responding
          APP_URL="https://magicglass-gegme7abcff0d5az.japaneast-01.azurewebsites.net"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $APP_URL --max-time 30 || echo "000")
          echo "Application HTTP Status: $HTTP_CODE"
          
          if [[ "$HTTP_CODE" == "200" ]] || [[ "$HTTP_CODE" == "302" ]]; then
            echo "✅ Application deployed successfully!"
          else
            echo "⚠️ App returned HTTP $HTTP_CODE - check logs"
            echo "Logs: https://magicglass-gegme7abcff0d5az.scm.japaneast-01.azurewebsites.net/api/logdump"
          fi
